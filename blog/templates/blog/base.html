<!doctype html>
<html>
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css"
    />
    <title>Tako'nun Blogu</title>
    <style>
      body {
        background-color: #f8f9fa;
      }
      .content-section {
        background: #ffffff;
        padding: 20px;
        border: 1px solid #dddddd;
        border-radius: 3px;
        margin-bottom: 20px;
        max-width: 600px;
        margin: auto;
      }

      .nav-link-btn {
        background: none;
        border: none;
        padding: 0;
        color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
        vertical-align: middle;
        line-height: inherit;
      }

      .nav-link-btn:hover {
        color: rgba(255, 255, 255, 0.75);
      }

      .logout-form {
        display: flex;
        align-items: center;
        margin: 0;
      }

      .account-img {
        height: 125px;
        width: 125px;
        margin-right: 20px;
        margin-bottom: 16px;
        border: 3px solid #dee2e6;
      }

      .account-heading {
        font-size: 2.5rem;
      }

      .form-control:focus {
        border-color: #17a2b8;
        box-shadow: 0 0 0 0.2rem rgba(23, 162, 184, 0.25);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="{% url 'blog-home' %}">Django Blog</a>
        <div class="navbar-nav d-flex flex-row align-items-center">
          <a class="nav-item nav-link" href="{% url 'blog-home' %}">Anasayfa</a>

          {% if user.is_authenticated %}
          <a class="nav-item nav-link" href="{% url 'profile' %}">Profilim</a>
          <form method="post" action="{% url 'logout' %}" class="logout-form">
            {% csrf_token %}
            <button type="submit" class="nav-item nav-link nav-link-btn ml-2">
              Çıkış Yap
            </button>
          </form>
          {% else %}
          <a class="nav-item nav-link" href="{% url 'login' %}">Giriş Yap</a>
          <a class="nav-item nav-link" href="{% url 'register' %}">Kayıt Ol</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main role="main" class="container">
      <div class="row">
        <div class="col-md-10 offset-md-1">
          {% block content %}{% endblock %}
        </div>
      </div>
    </main>
  </body>
</html>
